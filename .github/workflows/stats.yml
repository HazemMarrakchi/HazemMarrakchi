name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        theme: [github_dark, github]
    steps:
      - name: Generate summary cards (${{ matrix.theme }})
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: HazemMarrakchi
          theme: ${{ matrix.theme }}
