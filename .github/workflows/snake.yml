name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HazemMarrakchi
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee&color_dots=%230d1424,%23155e75,%230891b2,%2322d3ee,%23a78bfa
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=%230891b2&color_dots=%23e5e7eb,%23a5f3fc,%2322d3ee,%238b5cf6,%23a78bfa

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
